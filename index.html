<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8f8fb" />
  <meta name="description" content="Luma Planner — 週計畫、任務進度與專注管理，一個簡單而有條理的工作空間。" />
  <title>Luma Planner · Plan your week</title>
  <style>
    :root{--bg:#f8f8fb;--surface:#fff;--surface-alt:#f6f5f9;--border:#e9e7ee;--ink:#292832;--muted:#817e8a;--lav:#9181b5;--lav-dark:#75629f;--lav-pale:#f0ebf8;--lav-tint:#eae5f5;--green:#348b73;--green-bg:#e8f5ef;--amber:#b0783f;--amber-bg:#fff4e8;--red:#bc6575;--red-bg:#fff0f2;--shadow:0 12px 40px rgba(44,34,66,.045);--radius:17px;--fast:.18s ease}
    *{box-sizing:border-box}
    html{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg);font-size:14px;scroll-behavior:smooth}
    body{margin:0;min-height:100vh}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:disabled{opacity:.46;cursor:not-allowed}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.task-card:focus-visible{outline:3px solid #b7a6dc;outline-offset:3px}
    a{color:inherit;text-decoration:none}
    .icon{width:18px;height:18px;flex-shrink:0;vertical-align:middle;display:inline-block}
    .layout{display:grid;grid-template-columns:253px minmax(0,1fr);min-height:100vh}
    .sidebar{background:#fff;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:31px 18px 24px;z-index:20}
    .brand{display:flex;align-items:center;gap:12px;padding:0 12px 35px}
    .brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:#e9e2f5;color:var(--lav-dark)}
    .brand-mark svg{width:24px;height:24px}
    .brand strong{display:block;letter-spacing:-.65px;font-size:18px;font-weight:750}
    .brand small{color:var(--muted);font-size:11px;letter-spacing:.2px}
    .nav-label{font-size:10px;letter-spacing:1.8px;color:#aaa6b2;font-weight:750;padding:0 15px;margin:6px 0 15px}
    .nav{display:flex;flex-direction:column;gap:5px}
    .nav-button{border:0;background:transparent;color:#736f7c;border-radius:11px;text-align:left;padding:12px 14px;display:flex;align-items:center;gap:13px;font-weight:570;width:100%;transition:background var(--fast),color var(--fast)}
    .nav-button:hover{background:#f8f6fb;color:var(--ink)}
    .nav-button.active{background:var(--lav-pale);color:var(--lav-dark);font-weight:750}
    .nav-button .icon{width:19px;height:19px}
    .sidebar-bottom{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--border)}
    .sidebar-note{background:linear-gradient(135deg,#f5f1fa,#f9f8fc);border:1px solid #f0ebf6;border-radius:13px;padding:16px 14px;margin-bottom:13px}
    .sidebar-note .mini-dot{height:7px;width:7px;background:var(--lav);border-radius:50%;display:inline-block;margin-right:6px}
    .sidebar-note strong{font-size:12px}
    .sidebar-note p{font-size:11px;color:var(--muted);line-height:1.7;margin:6px 0 0}
    .sidebar-footer{color:#b2aeb9;font-size:11px;padding:6px 3px}
    .main{min-width:0;position:relative}
    .topbar{height:77px;padding:0 clamp(22px,4vw,68px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eeedf1;background:rgba(248,248,251,.91);backdrop-filter:blur(15px);position:sticky;top:0;z-index:15}
    .breadcrumbs{color:var(--muted);font-size:12px;display:flex;gap:11px;align-items:center}
    .breadcrumbs strong{color:#4a4555;font-weight:650}
    .top-right{display:flex;align-items:center;gap:16px}
    .top-date{font-size:12px;color:var(--muted)}
    .avatar{width:35px;height:35px;border-radius:11px;background:var(--lav-pale);color:var(--lav-dark);font-weight:750;display:grid;place-items:center;border:1px solid #e4ddf1}
    .content{max-width:1490px;margin:auto;padding:37px clamp(22px,4vw,68px) 70px}
    .page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:26px}
    .eyebrow{font-size:11px;letter-spacing:1.85px;text-transform:uppercase;color:var(--lav);font-weight:800;margin:0 0 9px}
    h1{font-size:clamp(26px,3vw,33px);font-weight:740;letter-spacing:-1.1px;line-height:1.23;margin:0}
    .subhead{color:var(--muted);margin:9px 0 0;font-size:13px;line-height:1.75}
    h2{font-size:18px;letter-spacing:-.35px;margin:0;font-weight:720}
    h3{font-size:15px;margin:0;font-weight:700}
    .actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#fff;color:#564f60;border:1px solid #e3e0e9;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:675;line-height:1.2;min-height:38px;transition:all var(--fast);white-space:nowrap}
    .btn .icon{width:16px;height:16px}
    .btn:hover:not(:disabled){border-color:#c4b8d5;background:#faf8fd;transform:translateY(-1px)}
    .btn.primary{background:var(--lav);border-color:var(--lav);color:white;box-shadow:0 4px 12px rgba(145,129,181,.13)}
    .btn.primary:hover:not(:disabled){background:var(--lav-dark);border-color:var(--lav-dark)}
    .btn.ghost{border-color:transparent;background:transparent}
    .btn.danger{color:var(--red);border-color:#f0d7dd;background:#fff9fa}
    .btn.small{min-height:31px;padding:7px 10px;font-size:11px;border-radius:8px}
    .btn.icon-btn{padding:8px;min-width:36px}
    .btn.wide{width:100%}
    .stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;margin-bottom:24px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
    .stat{padding:22px 23px 20px;position:relative;overflow:hidden}
    .stat-top{display:flex;align-items:center;justify-content:space-between;gap:9px}
    .stat-label{color:var(--muted);font-size:12px;font-weight:610}
    .stat-icon{width:35px;height:35px;border-radius:11px;background:#f2eef9;display:grid;place-items:center;color:var(--lav-dark)}
    .stat-icon .icon{height:17px;width:17px}
    .stat-value{font-size:31px;letter-spacing:-1.5px;font-weight:760;margin-top:12px;font-variant-numeric:tabular-nums}
    .stat-foot{font-size:11px;color:#a09ca9;margin-top:5px}
    .dashboard-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:19px;align-items:start}
    .section-card{padding:22px}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:19px}
    .section-head .mini-link{color:var(--lav-dark);font-weight:650;font-size:11px;background:transparent;border:0;padding:5px}
    .section-head .mini-link:hover{text-decoration:underline}
    .chip{display:inline-flex;align-items:center;gap:5px;border-radius:50px;padding:5px 9px;font-size:10px;font-weight:710;background:#f2f0f5;color:#777080;white-space:nowrap}
    .chip.lav{background:var(--lav-pale);color:var(--lav-dark)}
    .chip.green{background:var(--green-bg);color:var(--green)}
    .chip.amber{background:var(--amber-bg);color:var(--amber)}
    .chip.red{background:var(--red-bg);color:var(--red)}
    .task-list{display:flex;flex-direction:column;gap:9px}
    .task-row{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #eeecf2;border-radius:12px;min-width:0;background:#fff;transition:border-color var(--fast),box-shadow var(--fast)}
    .task-row:hover{border-color:#d8d0e7;box-shadow:0 3px 15px rgba(47,36,68,.04)}
    .task-check{color:#c4bdce;background:transparent;padding:0;border:0;display:grid;place-items:center;width:25px;height:25px}
    .task-check.complete{color:var(--green)}
    .task-row-main{flex:1;min-width:0;cursor:pointer;background:none;border:none;text-align:left;padding:0;color:inherit}
    .task-title{font-weight:675;font-size:13px;line-height:1.4;overflow-wrap:anywhere}
    .task-title.done{text-decoration:line-through;color:#9a95a1}
    .task-meta{color:var(--muted);font-size:11px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px}
    .project-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;vertical-align:middle}
    .row-right{display:flex;align-items:center;gap:9px;flex-shrink:0}
    .mini-progress{width:54px;height:5px;border-radius:99px;background:#ece8f2;overflow:hidden}
    .mini-progress>span{display:block;background:var(--lav);height:100%;border-radius:99px}
    .progress-track{width:100%;height:8px;background:#ece8f4;border-radius:30px;overflow:hidden}
    .progress-fill{height:100%;background:var(--lav);border-radius:30px;transition:width .24s ease}
    .progress-row{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:9px;font-size:12px}
    .progress-row .muted{color:var(--muted)}
    .stack{display:flex;flex-direction:column;gap:18px}
    .weekly-glance{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end;gap:9px;min-height:112px;margin-top:18px}
    .glance-day{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
    .glance-track{height:80px;display:flex;align-items:flex-end;width:100%;max-width:27px;background:#f6f3fa;border-radius:7px;overflow:hidden}
    .glance-bar{background:#b5a6d0;width:100%;min-height:2px;border-radius:7px;transition:height .3s}
    .glance-day.today .glance-bar{background:var(--lav-dark)}
    .glance-day-label{font-size:10px;color:var(--muted)}
    .glance-day.today .glance-day-label{color:var(--lav-dark);font-weight:800}
    .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:35px 18px;gap:9px;color:var(--muted)}
    .empty-icon{width:52px;height:52px;border-radius:17px;background:var(--lav-pale);color:var(--lav-dark);display:grid;place-items:center;margin-bottom:4px}
    .empty strong{font-size:14px;color:var(--ink)}
    .empty p{margin:0;line-height:1.7;font-size:12px;max-width:320px}
    .week-control{display:flex;gap:6px;align-items:center}
    .week-range{font-size:13px;font-weight:675;white-space:nowrap;margin:0 7px}
    .week-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
    .week-board{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:10px;min-width:1090px}
    .week-scroll{overflow:auto;padding-bottom:10px}
    .day-column{background:#fff;border:1px solid var(--border);border-radius:14px;min-height:315px;padding:13px 10px;display:flex;flex-direction:column;gap:10px;transition:background var(--fast),border-color var(--fast)}
    .day-column.today{border-color:#b8a4da;background:#fdfbff}
    .day-column.drag-over{border-color:var(--lav);background:var(--lav-pale)}
    .day-title{display:flex;align-items:center;justify-content:space-between}
    .day-label{font-size:10px;color:var(--muted);font-weight:760;letter-spacing:.4px}
    .day-date{margin-top:3px;font-size:22px;font-weight:740;letter-spacing:-1px}
    .day-column.today .day-date{color:var(--lav-dark)}
    .day-total{font-size:10px;color:var(--muted);padding:7px 0;border-top:1px solid var(--border);margin-top:auto;display:flex;justify-content:space-between}
    .day-add{width:100%;padding:9px 6px;border:1px dashed #d8d0e2;border-radius:8px;background:none;color:#91849e;font-size:11px;display:flex;justify-content:center;gap:5px;align-items:center}
    .day-add:hover{background:#f7f3fa}
    .day-task{border:1px solid #eeeaf2;border-radius:10px;padding:10px 9px;background:#faf9fc;cursor:pointer;transition:border-color var(--fast)}
    .day-task:hover{border-color:#bbadd2}
    .day-task[draggable="true"]{cursor:grab}
    .day-task-top{display:flex;justify-content:space-between;align-items:center;gap:5px}
    .day-task .name{font-size:11px;font-weight:750;margin:7px 0 5px;line-height:1.35;word-break:break-word}
    .day-task .foot{display:flex;justify-content:space-between;gap:3px;color:var(--muted);font-size:10px;margin-bottom:7px}
    .day-task .progress-track{height:5px}
    .day-task.archived{opacity:.76;background:#f7f6f8}
    .legend{display:flex;align-items:center;gap:17px;color:var(--muted);font-size:11px;flex-wrap:wrap}
    .legend-item{display:inline-flex;align-items:center;gap:6px}
    .legend-circle{width:8px;height:8px;border-radius:50%;background:var(--lav)}
    .workload-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(250px,1fr);gap:19px;margin-top:20px;align-items:start}
    .day-load-list{display:flex;flex-direction:column;gap:12px}
    .day-load-row{display:grid;grid-template-columns:38px 1fr 54px;align-items:center;gap:10px;font-size:11px;color:var(--muted)}
    .load-track{height:9px;border-radius:20px;background:#f0edf5;overflow:hidden}
    .load-fill{height:100%;background:#b3a2ce;border-radius:20px}
    .project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
    .project-card{padding:23px;display:flex;flex-direction:column;gap:19px}
    .project-card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .project-title-row{display:flex;align-items:center;gap:10px}
    .project-ico{width:39px;height:39px;display:grid;place-items:center;border-radius:12px;background:#f6f2fa}
    .project-description{line-height:1.6;font-size:12px;color:var(--muted);min-height:19px}
    .project-metrics{display:flex;gap:24px;flex-wrap:wrap}
    .project-metrics div strong{display:block;font-size:16px;font-variant-numeric:tabular-nums}
    .project-metrics div span{color:var(--muted);font-size:10px}
    .project-detail{margin-top:24px}
    .project-detail-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .goal-input{min-height:78px}
    .focus-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.8fr);gap:19px;align-items:start}
    .focus-main{padding:31px 25px;text-align:center}
    .toggle-group{display:inline-flex;gap:4px;background:#f4f2f7;border:1px solid #eeeaf3;border-radius:11px;padding:4px}
    .toggle-option{border:0;background:transparent;color:#8b8493;font-size:12px;font-weight:750;border-radius:8px;padding:10px 19px}
    .toggle-option.active{background:#fff;color:var(--lav-dark);box-shadow:0 2px 9px rgba(50,35,73,.08)}
    .focus-orbit{width:min(290px,75vw);aspect-ratio:1;position:relative;display:grid;place-items:center;margin:34px auto 24px;border-radius:50%;background:conic-gradient(var(--lav) var(--arc,0%),#efecf5 0)}
    .focus-orbit:before{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}
    .focus-center{position:relative;z-index:1}
    .focus-time{font-size:clamp(50px,6vw,68px);font-weight:760;letter-spacing:-3.5px;font-variant-numeric:tabular-nums}
    .focus-stage{color:var(--lav-dark);font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
    .focus-description{color:var(--muted);font-size:12px;margin-top:8px}
    .focus-buttons{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:19px;flex-wrap:wrap}
    .focus-action{height:46px;min-width:130px;border-radius:13px}
    .field{display:flex;flex-direction:column;gap:7px;min-width:0}
    .field label{font-weight:680;font-size:12px;color:#55505f}
    .field input,.field select,.field textarea{background:#fff;border:1px solid #dedbe5;border-radius:10px;padding:11px 12px;width:100%;color:var(--ink);outline:none;min-height:40px;transition:border-color var(--fast),box-shadow var(--fast)}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--lav);box-shadow:0 0 0 3px #9181b51d}
    .field textarea{resize:vertical;min-height:76px;line-height:1.6}
    .field-help{color:var(--muted);font-size:11px;line-height:1.55}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .full{grid-column:1/-1}
    .focus-side .section-card{margin-bottom:18px}
    .muted{color:var(--muted)}
    .small-text{font-size:12px;line-height:1.65}
    .session-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0edf3}
    .session-item:last-child{border-bottom:0}
    .session-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--lav-pale);color:var(--lav-dark)}
    .session-item .label{flex:1;min-width:0;font-size:12px;font-weight:650}
    .session-item .label span{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:3px}
    .session-item .duration{font-size:12px;font-weight:740}
    .analytics-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.9fr);gap:19px;margin-top:5px}
    .bar-chart{height:230px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:17px;align-items:end;padding-top:15px}
    .bar-group{height:100%;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:flex-end}
    .bar-duo{height:175px;display:flex;gap:5px;align-items:flex-end;justify-content:center;width:100%}
    .bar{width:min(31px,44%);border-radius:6px 6px 3px 3px;min-height:2px;transition:height .25s;position:relative}
    .bar.planned{background:#d9d0e9}.bar.actual{background:var(--lav)}
    .bar:hover:after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translate(-50%,-7px);white-space:nowrap;font-size:10px;background:#36323c;color:white;padding:5px 7px;border-radius:5px;z-index:2;pointer-events:none}
    .bar-day{font-size:11px;color:var(--muted)}
    .analytics-project{margin:17px 0}
    .settings-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:19px;align-items:start}
    .settings-group{padding:24px}
    .settings-group h2{margin-bottom:6px}
    .settings-sub{font-size:12px;color:var(--muted);margin:0 0 21px;line-height:1.65}
    .settings-form{display:flex;flex-direction:column;gap:15px}
    .settings-actions{display:flex;flex-direction:column;gap:11px}
    .setting-action{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid var(--border);border-radius:12px;flex-wrap:wrap}
    .setting-action strong{font-size:12px;display:block}
    .setting-action p{color:var(--muted);font-size:11px;margin:4px 0 0;line-height:1.6}
    .alert{border-radius:11px;padding:13px 15px;background:#f5f1fb;border:1px solid #ece3f6;color:#65557b;font-size:12px;line-height:1.7;display:flex;gap:10px;align-items:flex-start}
    .alert.warn{background:var(--amber-bg);border-color:#f4dfc7;color:#8a623e}
    .modal-shell{position:fixed;inset:0;z-index:50;background:rgba(36,32,43,.42);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
    .modal{width:min(100%,510px);max-height:min(91vh,850px);overflow-y:auto;background:#fff;border:1px solid #e8e4ee;border-radius:20px;box-shadow:0 25px 80px rgba(26,18,40,.18);padding:25px;animation:rise .19s ease}
    .modal.large{width:min(100%,650px)}
    @keyframes rise{from{transform:translateY(10px);opacity:.6}to{transform:translateY(0);opacity:1}}
    .modal-top{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:22px}
    .modal-top h2{font-size:21px}
    .modal-description{font-size:12px;color:var(--muted);line-height:1.7;margin:6px 0 0}
    .modal-footer{display:flex;justify-content:flex-end;gap:10px;align-items:center;flex-wrap:wrap;margin-top:23px}
    .slider{width:100%;accent-color:var(--lav);cursor:pointer}
    .progress-editor{background:#f9f7fc;border-radius:13px;padding:17px;margin:15px 0}
    .progress-editor .percent{color:var(--lav-dark);font-weight:800;font-size:22px}
    .detail-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:13px}
    .detail-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:13px}
    .detail-metric{background:#f8f7fa;border-radius:12px;padding:14px 10px}
    .detail-metric strong{display:block;font-size:18px;letter-spacing:-.5px}
    .detail-metric span{color:var(--muted);font-size:10px}
    .divider{height:1px;background:var(--border);margin:19px 0}
    .toast-area{position:fixed;bottom:24px;right:25px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
    .toast{background:#38333f;color:#fff;border-radius:11px;padding:12px 15px;box-shadow:0 13px 35px #1e182333;display:flex;align-items:center;gap:10px;font-size:12px;line-height:1.5;animation:rise .2s ease}

<body>
  <div class="layout">

  </div>
  <div id="modal-root"></div>

  <input id="file-import" type="file" accept="application/json,.json" class="hidden" aria-label="匯入 JSON 備份" />
  <script>
  'use strict';
  const STORAGE_KEY='lumaPlanner_v1';
  const DAY_LABELS=['週一','週二','週三','週四','週五','週六','週日'];
  const NAV=[['dashboard','Dashboard','home'],['planner','Weekly Planner','calendar'],['projects','Projects','folder'],['focus','Focus','timer'],['analytics','Analytics','chart'],['settings','Settings','settings']];
  const PROJECT_COLORS=['#9181b5','#7295ad','#6b9a87','#c69b76','#b58b9f','#948caa'];
  const ICON_PATHS={
    sparkle:'<path d="m12 3 1.9 6.1L20 11l-6.1 1.9L12 19l-1.9-6.1L4 11l6.1-1.9L12 3Z"/><path d="m19 17 .7 1.3L21 19l-1.3.7L19 21l-.7-1.3L17 19l1.3-.7L19 17Z"/>',

    plus:'<path d="M12 5v14M5 12h14"/>',

    copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',

    target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    bolt:'<path d="m13 2-9 12h7l-1 8 10-13h-7l0-7Z"/>',
    link:'<path d="M10 14a5 5 0 0 0 7 .3l3-3a5 5 0 0 0-7-7l-2 2M14 10a5 5 0 0 0-7-.3l-3 3a5 5 0 0 0 7 7l2-2"/>',
    bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
    more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'
  };
  function icon(name,size=18){return `<svg class="icon" width="${size}" height="${size}" style="width:${size}px;height:${size}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]||ICON_PATHS.circle}</svg>`;}
  const $=(selector,root=document)=>root.querySelector(selector);
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`id_${Date.now().toString(36)}_${Math.random().toString(36).slice(2)}`;
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  function parseLocalDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s)))return null;const [y,m,d]=s.split('-').map(Number);const date=new Date(y,m-1,d,12);return date.getFullYear()===y&&date.getMonth()===m-1&&date.getDate()===d?date:null;}
  function isoDate(date){const d=new Date(date);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function dateOffset(s,num){const d=parseLocalDate(s);if(!d)return today();d.setDate(d.getDate()+num);return isoDate(d);}
  function today(){return isoDate(new Date());}
  function weekStart(s){const d=parseLocalDate(s)||new Date();const offset=(d.getDay()+6)%7;d.setDate(d.getDate()-offset);return isoDate(d);}
  function dateText(s,options){return (parseLocalDate(s)||new Date()).toLocaleDateString('zh-TW',options||{month:'short',day:'numeric'});}
  function dateRange(w){let end=dateOffset(w,6);let a=parseLocalDate(w),b=parseLocalDate(end);return `${a.getFullYear()} / ${a.getMonth()+1}.${a.getDate()} — ${b.getMonth()+1}.${b.getDate()}`;}
  function fmt(minutes){let m=Math.max(0,Math.round(Number(minutes)||0));let h=Math.floor(m/60);return h?`${h}h${m%60?` ${m%60}m`:''}`:`${m}m`;}
  function fmtLong(ms){const s=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
  function fmtClock(ms,withHours=false){let s=Math.max(0,Math.floor(ms/1000));return (withHours||s>=3600)?`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`:`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
  function defaultState(){return {version:1,projects:[],tasks:[],weeklyGoals:[],focusSessions:[],settings:{displayName:'',focusMinutes:25,shortBreakMinutes:5,longBreakMinutes:15,soundEnabled:true},timerState:null};}
  let state=defaultState(),view='dashboard',selectedWeek=weekStart(today()),selectedProject=null,modal=null,storageOk=true,hydratedTimer=false;
  function validateData(o){
    if(!o||typeof o!=='object'||o.version!==1||!Array.isArray(o.projects)||!Array.isArray(o.tasks)||!Array.isArray(o.weeklyGoals)||!Array.isArray(o.focusSessions)||!o.settings||typeof o.settings!=='object')throw Error('檔案版本或資料結構不正確');
    if(o.projects.length>10000||o.tasks.length>100000||o.focusSessions.length>250000)throw Error('資料量超出限制');
    const ids=new Set(),taskIds=new Set(),projectIds=new Set();
    for(const p of o.projects){if(typeof p.id!=='string'||!p.id||projectIds.has(p.id)||typeof p.name!=='string'||!p.name.trim()||p.name.length>150||typeof p.description!=='string')throw Error('專案資料不完整或重複');projectIds.add(p.id);}
    for(const t of o.tasks){if(typeof t.id!=='string'||!t.id||taskIds.has(t.id)||!projectIds.has(t.projectId)||typeof t.title!=='string'||!t.title.trim()||t.title.length>200||!parseLocalDate(t.scheduledDate)||!Number.isInteger(t.estimatedMinutes)||t.estimatedMinutes<1||t.estimatedMinutes>10000000||typeof t.progress!=='number'||!Number.isFinite(t.progress)||t.progress<0||t.progress>100||!['active','completed','carried_over'].includes(t.status)||typeof t.notes!=='string')throw Error('任務資料不完整');taskIds.add(t.id);if((t.status==='completed')!==(t.progress===100))throw Error('完成狀態與進度不一致');if(t.status==='carried_over'&&t.progress>=100)throw Error('轉移紀錄進度不正確');}
    const tm=new Map(o.tasks.map(t=>[t.id,t]));
    for(const t of o.tasks){if(t.carriedToId){const next=tm.get(t.carriedToId);if(!next||next.carriedFromId!==t.id||t.status!=='carried_over'||next.projectId!==t.projectId||next.scheduledDate<=t.scheduledDate)throw Error('Carry Over 關聯資料損壞');}if(t.carriedFromId){const prev=tm.get(t.carriedFromId);if(!prev||prev.carriedToId!==t.id)throw Error('前置任務不存在');}if(t.status==='carried_over'&&!t.carriedToId)throw Error('轉移任務缺少後續紀錄');}
    for(const g of o.weeklyGoals){if(!g||!projectIds.has(g.projectId)||!parseLocalDate(g.weekStart)||weekStart(g.weekStart)!==g.weekStart||typeof g.text!=='string')throw Error('每週目標資料不正確');}
    const sessionIds=new Set();
    for(const s of o.focusSessions){if(!s||typeof s.id!=='string'||sessionIds.has(s.id)||!Number.isFinite(s.durationMs)||s.durationMs<=0||s.durationMs>1000*60*60*24||!Number.isFinite(Date.parse(s.endedAt))||s.taskId&&!taskIds.has(s.taskId))throw Error('專注紀錄資料不正確');sessionIds.add(s.id);}
    const validTimer=o.timerState===null||o.timerState===undefined||(typeof o.timerState==='object'&&['pomodoro','free'].includes(o.timerState.mode)&&['focus','shortBreak','longBreak'].includes(o.timerState.stage)&&typeof o.timerState.running==='boolean'&&Number.isFinite(o.timerState.elapsedBeforePauseMs)&&o.timerState.elapsedBeforePauseMs>=0&&Number.isFinite(o.timerState.startedAt)&&Number.isFinite(o.timerState.plannedMs));
    if(!validTimer)throw Error('計時器資料不正確');
    return {version:1,projects:o.projects,tasks:o.tasks,weeklyGoals:o.weeklyGoals,focusSessions:o.focusSessions,settings:{...defaultState().settings,...o.settings},timerState:o.timerState||null};
  }
  function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)state=validateData(JSON.parse(raw));}catch(e){storageOk=false;state=defaultState();console.warn('資料讀取失敗:',e);}}
  function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageOk=true;return true;}catch(e){storageOk=false;notify('無法寫入本機儲存空間，請匯出 JSON 備份','error');console.warn(e);return false;}}
  function commit(message){persist();render();if(message)notify(message,'success');}
  function getProject(projectId){return state.projects.find(p=>p.id===projectId);}
  function getTask(taskId){return state.tasks.find(t=>t.id===taskId);}
  function color(project){const c=project?.color;return PROJECT_COLORS.includes(c)?c:PROJECT_COLORS[0];}
  function tasksOn(day){return state.tasks.filter(t=>t.scheduledDate===day).sort((a,b)=>(a.status==='completed')-(b.status==='completed')||a.createdAt.localeCompare(b.createdAt));}
  function weekTasks(w=selectedWeek,projectId=null){const end=dateOffset(w,6);return state.tasks.filter(t=>t.scheduledDate>=w&&t.scheduledDate<=end&&(!projectId||t.projectId===projectId));}
  function confirmedSessions(w=selectedWeek,projectId=null){const end=dateOffset(w,6);return state.focusSessions.filter(s=>{const d=isoDate(new Date(s.endedAt));const task=s.taskId?getTask(s.taskId):null;return d>=w&&d<=end&&(!projectId||(task&&task.projectId===projectId));});}
  function sumTime(tasks){return tasks.reduce((n,t)=>n+t.estimatedMinutes,0);}
  function focusMs(sessions){return sessions.reduce((sum,s)=>sum+s.durationMs,0);}
  function weightedStats(tasks,w){let weight=0,earned=0,remaining=0;for(const t of tasks){let successor=t.carriedToId?getTask(t.carriedToId):null;let sameWeek=!!successor&&weekStart(successor.scheduledDate)===w;let part=t.estimatedMinutes*t.progress/100;weight+=sameWeek?part:t.estimatedMinutes;earned+=part;if(t.status==='active')remaining+=t.estimatedMinutes*(1-t.progress/100);}return {pct:weight>0?clamp(100*earned/weight,0,100):0,remaining:Math.round(remaining),weight,earned};}
  function workForDay(day){return sumTime(tasksOn(day));}
  function projectFocusMs(pId,w=selectedWeek){return focusMs(confirmedSessions(w,pId));}
  function weeklyOverview(w=selectedWeek){const list=weekTasks(w),stats=weightedStats(list,w);return {list,...stats,planned:sumTime(list),focus:focusMs(confirmedSessions(w)),done:list.filter(t=>t.status==='completed').length};}
  function progressBar(p,size=''){return `<div class="progress-track" ${size?'style="height:'+size+'"':''} role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p)}"><div class="progress-fill" style="width:${clamp(p,0,100)}%"></div></div>`;}
  function pct(p){return `${Math.round(p)}%`;}
  function empty(iconName,title,desc,button=''){return `<div class="empty"><div class="empty-icon">${icon(iconName,24)}</div><strong>${title}</strong><p>${desc}</p>${button}</div>`;}
  function taskBadge(t){return t.status==='carried_over'?'<span class="chip amber">已轉移</span>':t.status==='completed'?'<span class="chip green">已完成</span>':t.carriedFromId?'<span class="chip lav">Carry Over</span>':'';}
  function taskRow(t){const p=getProject(t.projectId);return `<div class="task-row"><button class="task-check ${t.status==='completed'?'complete':''}" data-action="toggle-complete" data-id="${t.id}" aria-label="${t.status==='completed'?'取消完成':'標記完成'}" ${t.status==='carried_over'?'disabled title="已轉移任務不可修改"':''}>${icon(t.status==='completed'?'checkcircle':'circle',22)}</button><button class="task-row-main" data-action="task-detail" data-id="${t.id}"><div class="task-title ${t.status==='completed'?'done':''}">${esc(t.title)}</div><div class="task-meta"><span class="project-dot" style="background:${color(p)}"></span>${esc(p?.name||'未知專案')} · ${fmt(t.estimatedMinutes)} ${taskBadge(t)}</div></button><div class="row-right"><div class="mini-progress"><span style="width:${t.progress}%"></span></div><span class="muted" style="font-size:11px;min-width:29px">${pct(t.progress)}</span>${t.status==='active'?`<button class="btn icon-btn small" data-action="task-focus" data-id="${t.id}" title="開始專注" aria-label="對此任務開始專注">${icon('play',13)}</button>`:''}</div></div>`;}
  function renderNav(){document.getElementById('nav').innerHTML=NAV.map(([v,label,ic])=>`<button class="nav-button ${view===v?'active':''}" data-action="navigate" data-view="${v}" aria-current="${view===v?'page':'false'}">${icon(ic,19)}<span>${label}</span></button>`).join('');document.getElementById('page-breadcrumb').textContent=NAV.find(n=>n[0]===view)?.[1]||'Dashboard';document.getElementById('top-date').textContent=dateText(today(),{year:'numeric',month:'long',day:'numeric',weekday:'long'});document.getElementById('avatar').textContent=String(state.settings.displayName||'L').trim().slice(0,1).toUpperCase()||'L';}
  function heading(kicker,title,sub,actions=''){return `<div class="page-heading"><div><p class="eyebrow">${kicker}</p><h1>${title}</h1><p class="subhead">${sub}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;}
  function render(){renderNav();const pages={dashboard:renderDashboard,planner:renderPlanner,projects:renderProjects,focus:renderFocus,analytics:renderAnalytics,settings:renderSettings};$('#content').innerHTML=pages[view]();updateTimerDisplay();}

  function linkedChain(t){let root=t,seen=new Set();while(root?.carriedFromId&&!seen.has(root.id)){seen.add(root.id);root=getTask(root.carriedFromId);}if(!root)throw Error('任務關聯損壞');let ids=new Set(),cur=root;while(cur&&!ids.has(cur.id)){ids.add(cur.id);cur=cur.carriedToId?getTask(cur.carriedToId):null;}return ids;}
  function handleTaskDelete(taskId){let t=getTask(taskId);if(!t)return;const chain=linkedChain(t),msg=chain.size>1?`這項任務屬於一條包含 ${chain.size} 筆紀錄的 Carry Over 鏈。為了維持資料一致，會刪除整條任務鏈及其專注紀錄。`:'將刪除此任務及綁定的專注紀錄，操作無法復原。';confirmDialog('刪除任務？',msg,()=>{state.tasks=state.tasks.filter(x=>!chain.has(x.id));state.focusSessions=state.focusSessions.filter(x=>!chain.has(x.taskId));if(timer().taskId&&chain.has(timer().taskId))state.timerState=newTimer(timer().mode);closeModal();commit('任務已刪除');},{danger:true,button:'確認刪除',warning:'建議先匯出 JSON 備份。'});}
  function handleProjectDelete(pid){const p=getProject(pid);if(!p)return;const count=state.tasks.filter(t=>t.projectId===pid).length;confirmDialog('刪除專案？',`將刪除「${p.name}」以及其 ${count} 筆任務、每週目標與相關專注紀錄，無法復原。`,()=>{const tIds=new Set(state.tasks.filter(t=>t.projectId===pid).map(t=>t.id));state.projects=state.projects.filter(q=>q.id!==pid);state.tasks=state.tasks.filter(t=>!tIds.has(t.id));state.weeklyGoals=state.weeklyGoals.filter(g=>g.projectId!==pid);state.focusSessions=state.focusSessions.filter(s=>!tIds.has(s.taskId));if(tIds.has(timer().taskId))state.timerState=newTimer(timer().mode);selectedProject=null;closeModal();commit('專案與相關資料已刪除');},{danger:true,button:'刪除專案',warning:'建議先匯出資料備份。'});}
  function startTaskFocus(taskId){const t=getTask(taskId);if(!t||t.status!=='active'){notify('這個任務目前不能開始專注','error');return;}const cur=timer();if(cur.running){notify('請先結束目前的計時，才能切換任務','error');return;}if(elapsedTime(cur)>0&&cur.stage==='focus'){confirmDialog('切換專注任務？','計時器已有未儲存的時間，切換會捨棄目前計時。',()=>{state.timerState=newTimer(cur.mode,taskId);closeModal();view='focus';commit();},{button:'捨棄並切換'});return;}cur.taskId=taskId;cur.stage='focus';cur.elapsedBeforePauseMs=0;cur.running=false;cur.plannedMs=cur.mode==='pomodoro'?state.settings.focusMinutes*60000:0;closeModal();view='focus';commit();}
  // Focus timer engine. Elapsed time is calculated from wall-clock timestamps, not interval ticks.
  let timerEndLock=false;
  function playPause(){const t=timer();if(t.running){t.elapsedBeforePauseMs=elapsedTime(t);t.startedAt=0;t.running=false;}else{if(t.mode==='pomodoro'&&t.elapsedBeforePauseMs>=t.plannedMs){notify('此回合已結束，請先完成紀錄或重設','error');return;}t.startedAt=Date.now();t.running=true;}persist();updateTimerDisplay();}
  function resetTimer(){const t=timer();if(elapsedTime(t)>1000){confirmDialog('重設計時器？','目前這段尚未儲存的時間會被捨棄。',()=>{state.timerState={...newTimer(t.mode,t.taskId),cycles:t.cycles};closeModal();commit('計時器已重設');},{button:'確認重設'});return;}state.timerState={...newTimer(t.mode,t.taskId),cycles:t.cycles};commit();}
  function stopTimer(){const t=timer();if(t.stage!=='focus'){notify('休息階段不會產生專注紀錄');return;}if(elapsedTime(t)<1000){notify('至少專注 1 秒後才能儲存');return;}t.elapsedBeforePauseMs=elapsedTime(t);t.startedAt=0;t.running=false;persist();openModal('finish',{auto:false});}
  function promptTimerEnd(){if(timerEndLock||timerRecoveryPending)return;const t=timer();if(!t.running||t.mode!=='pomodoro'||elapsedTime(t)<t.plannedMs)return;timerEndLock=true;t.running=false;t.startedAt=0;t.elapsedBeforePauseMs=t.plannedMs;persist();playSound();if(t.stage==='focus')openModal('finish',{auto:true});else openModal('breakDone');timerEndLock=false;}
  function playSound(){if(!state.settings.soundEnabled)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=660;gain.gain.setValueAtTime(.025,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.24);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.25);osc.onended=()=>ctx.close();}catch(e){/* Sound may be blocked by browser autoplay rules. */}}
  function advanceStage(auto){const t=timer(),mode=t.mode,taskId=t.taskId,cycles=t.cycles+(auto&&mode==='pomodoro'&&t.stage==='focus'?1:0);state.timerState=newTimer(mode,taskId);state.timerState.cycles=cycles;if(auto&&mode==='pomodoro'){let stage=cycles%4===0?'longBreak':'shortBreak';state.timerState.stage=stage;state.timerState.plannedMs=(stage==='longBreak'?state.settings.longBreakMinutes:state.settings.shortBreakMinutes)*60000;}}
  function finishSave(){const t=timer(),auto=!!modal?.auto;if(t.stage!=='focus')return;let duration=Math.max(1000,auto&&t.mode==='pomodoro'?t.plannedMs:elapsedTime(t));duration=Math.min(duration,86400000);const taskId=t.taskId&&getTask(t.taskId)?t.taskId:null;state.focusSessions.push({id:id(),taskId,durationMs:Math.round(duration),endedAt:new Date().toISOString(),mode:t.mode});advanceStage(auto);closeModal();commit('專注時間已儲存');if(taskId&&getTask(taskId)?.status==='active')openModal('progress',{id:taskId});}
  function endBreak(nextStart){const t=timer(),cycles=t.cycles,taskId=t.taskId;state.timerState=newTimer('pomodoro',taskId);state.timerState.cycles=cycles;if(nextStart){state.timerState.startedAt=Date.now();state.timerState.running=true;}closeModal();commit(nextStart?'下一輪專注開始':'休息結束，準備下一輪');}
  function recoverTimer(keep){let t=timer();if(keep){t.elapsedBeforePauseMs=t.mode==='pomodoro'?Math.min(t.plannedMs,elapsedTime(t)):Math.min(elapsedTime(t),86400000);t.startedAt=0;t.running=false;}else state.timerState=newTimer(t.mode,t.taskId);timerRecoveryPending=false;modal=null;$('#modal-root').innerHTML='';commit(keep?'已暫停並恢復計時狀態':'已捨棄中斷計時');}
  function exportJSON(){const file=new Blob([JSON.stringify(state,null,2)],{type:'application/json;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(file);link.download=`luma-planner-backup-${today()}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),1500);notify('JSON 備份已下載','success');}
  async function importJSON(file){if(!file)return;try{if(file.size>20*1024*1024)throw Error('備份檔案過大（上限 20MB）');const raw=await file.text(),candidate=validateData(JSON.parse(raw));confirmDialog('匯入備份並取代目前資料？','檔案驗證完成。匯入後目前所有專案、任務與專注紀錄會被新資料取代。',()=>{state=candidate;if(state.timerState?.running){state.timerState.running=false;state.timerState.startedAt=0;state.timerState.elapsedBeforePauseMs=0;}selectedProject=null;selectedWeek=weekStart(today());closeModal();commit('備份資料已成功匯入');},{warning:'建議先匯出目前的資料，避免覆蓋後無法復原。',button:'確認匯入'});}catch(e){notify(`無法匯入：${e.message}`,'error');}finally{$('#file-import').value='';}}
  // Event delegation: elements are regenerated when switching pages, so handlers live on document.
  document.addEventListener('click',event=>{
    if(event.target.classList?.contains('modal-shell')&&event.target.dataset.overlay==='true'){closeModal();return;}
    const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,tid=el.dataset.id;
    switch(action){
      case 'navigate':view=el.dataset.view;closeModal();render();window.scrollTo({top:0,behavior:'instant'});break;
      case 'go-planner':view='planner';selectedWeek=weekStart(today());render();break;
      case 'add-project':openModal('project');break;
      case 'edit-project':openModal('project',{id:tid});break;
      case 'delete-project':handleProjectDelete(tid);break;
      case 'add-task':if(!state.projects.length){notify('請先建立一個專案，再新增任務');openModal('project');}else openModal('task',{date:el.dataset.date||today(),project:el.dataset.project});break;
      case 'task-detail':openModal('task',{id:tid});break;
      case 'edit-goal':openModal('goal',{id:tid});break;
      case 'project-details':selectedProject=selectedProject===tid?null:tid;render();break;
      case 'toggle-complete':{
        const t=getTask(tid);if(!t||t.status==='carried_over')break;setTaskProgress(t,t.status==='completed'?0:100);commit(t.status==='completed'?'任務已完成':'任務已設回進行中');break;
      }
      case 'duplicate-task':{
        const t=getTask(tid);if(!t)return;openModal('task',{duplicateId:tid,date:today()});break;
      }
      case 'delete-task':handleTaskDelete(tid);break;
      case 'carry-task':openModal('carry',{id:tid});break;
      case 'task-focus':startTaskFocus(tid);break;
      case 'week-prev':selectedWeek=dateOffset(selectedWeek,-7);selectedProject=null;render();break;
      case 'week-next':selectedWeek=dateOffset(selectedWeek,7);selectedProject=null;render();break;
      case 'week-today':selectedWeek=weekStart(today());selectedProject=null;render();break;
      case 'open-overdue':openModal('overdue');break;
      case 'modal-close':closeModal();break;
      case 'confirm-yes':{const yes=pendingConfirm;pendingConfirm=null;if(typeof yes==='function')yes();break;}
      case 'progress-complete':{const t=getTask(modal?.id);if(!t)break;setTaskProgress(t,100);closeModal();commit('任務已完成');break;}
      case 'timer-play':playPause();break;
      case 'timer-stop':stopTimer();break;
      case 'timer-reset':resetTimer();break;
      case 'timer-mode':{
        const requested=el.dataset.mode,t=timer();if(requested===t.mode)break;
        const switchMode=()=>{const taskId=t.taskId;state.timerState=newTimer(requested,taskId);closeModal();commit();};
        if(elapsedTime(t)>1000){confirmDialog('切換計時模式？','目前尚未儲存的計時會被捨棄。',switchMode,{button:'確認切換'});}else switchMode();break;
      }
      case 'finish-save':finishSave();break;
      case 'break-ready':endBreak(false);break;
      case 'break-start':endBreak(true);break;
      case 'recovery-keep':recoverTimer(true);break;
      case 'recovery-discard':recoverTimer(false);break;
      case 'export':exportJSON();break;
      case 'import':$('#file-import').click();break;
      case 'clear-all':confirmDialog('清除所有資料？','所有專案、任務、歷史紀錄、專注時間及設定都會被永久清除。',()=>{state=defaultState();selectedWeek=weekStart(today());selectedProject=null;view='dashboard';closeModal();commit('資料已清空');},{danger:true,button:'清空所有資料',warning:'此操作不可復原。建議先按「匯出」進行備份。'});break;
    }
  });
  document.addEventListener('submit',event=>{const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();handleForm(form);});
  document.addEventListener('input',event=>{
    if(event.target.id==='task-progress-slider'){
      const value=Number(event.target.value),label=$('#task-progress-label'),bar=$('#modal-root .progress-fill');if(label)label.textContent=pct(value);if(bar)bar.style.width=clamp(value,0,100)+'%';
    }
  });
  document.addEventListener('change',event=>{
    if(event.target.id==='focus-task'){
      const t=timer();if(t.running||elapsedTime(t)>0){notify('請先完成或重設目前的計時器，再切換任務','error');render();return;}
      const taskId=event.target.value;t.taskId=taskId||null;persist();
    }
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&modal){event.preventDefault();closeModal();return;}
    if((event.key==='Enter'||event.key===' ')&&event.target.classList?.contains('day-task')){event.preventDefault();openModal('task',{id:event.target.dataset.id});}
  });
  document.addEventListener('dragstart',event=>{
    const target=event.target.closest('.day-task[draggable="true"]');if(target&&event.dataTransfer){event.dataTransfer.setData('text/plain',target.dataset.id);event.dataTransfer.effectAllowed='move';}
  });
  document.addEventListener('dragover',event=>{const col=event.target.closest('.day-column');if(col){event.preventDefault();event.dataTransfer.dropEffect='move';col.classList.add('drag-over');}});
  document.addEventListener('dragleave',event=>{const col=event.target.closest('.day-column');if(col&&!col.contains(event.relatedTarget))col.classList.remove('drag-over');});
  document.addEventListener('drop',event=>{
    const col=event.target.closest('.day-column');document.querySelectorAll('.day-column.drag-over').forEach(e=>e.classList.remove('drag-over'));if(!col)return;event.preventDefault();const t=getTask(event.dataTransfer?.getData('text/plain'));if(!t||t.status!=='active')return;const dest=col.dataset.day;if(dest===t.scheduledDate)return;if(t.carriedFromId&&dest<=getTask(t.carriedFromId)?.scheduledDate){notify('承接任務的日期需晚於原始任務','error');return;}t.scheduledDate=dest;t.updatedAt=new Date().toISOString();commit(`已移動至 ${dateText(dest)}`);
  });
  $('#file-import').addEventListener('change',event=>importJSON(event.target.files?.[0]));
  window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY){try{if(event.newValue){state=validateData(JSON.parse(event.newValue));render();notify('已更新其他分頁的資料');}}catch(e){notify('其他分頁的資料格式無法讀取','error');}}});
  setInterval(()=>{if(!timerRecoveryPending){promptTimerEnd();updateTimerDisplay();}},250);
  // Initialize. No placeholder projects or demo tasks are inserted.
  document.getElementById('brand-mark').innerHTML=icon('sparkle',24);
  load();
  if(!state.timerState)state.timerState=newTimer();
  if(state.timerState.running)timerRecoveryPending=true;
  render();
  if(timerRecoveryPending)openModal('recovery');
  </script>
</body>
</html>
